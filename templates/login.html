<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Telegram Multi-Account Manager</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <div class="brand-icon" style="margin: 0 auto;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.198 2.433a2.242 2.242 0 0 0-1.022.215l-16.5 7.5a2.25 2.25 0 0 0 .126 4.143l4.63 1.543 2.11 6.33a2.25 2.25 0 0 0 4.092.384l2.76-4.14 4.542 3.407a2.25 2.25 0 0 0 3.564-1.503l3-15a2.25 2.25 0 0 0-2.302-2.579z"/>
          </svg>
        </div>
        <h2>Masuk Dashboard</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Kelola semua akun Telegram Anda dalam satu portal</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="user-preset-select">Pilih Username</label>
          <select id="user-preset-select" class="form-input" style="background-color: #0f172a; color: #f8fafc; margin-bottom: 8px; cursor: pointer;">
            <option value="">Memuat daftar user...</option>
          </select>
          <input type="text" id="username" class="form-input" placeholder="Username (terisi otomatis / ketik manual)" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password-preset-select">Pilih Password</label>
          <select id="password-preset-select" class="form-input" style="background-color: #0f172a; color: #f8fafc; margin-bottom: 8px; cursor: pointer;">
            <option value="semua" style="background: #0f172a; color: #f8fafc;">🔑 semua (Password user "semua")</option>
            <option value="perampok" selected style="background: #0f172a; color: #f8fafc;">🔑 perampok (Password user lainnya)</option>
            <option value="__manual__" style="background: #0f172a; color: #f8fafc;">✏️ Ketik password manual...</option>
          </select>
          <input type="password" id="password" class="form-input" placeholder="Password (terisi otomatis / ketik manual)" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;" id="login-btn">
          <span>Masuk</span>
        </button>
      </form>

      <div class="auth-footer">
        Belum punya akun dashboard? <a href="/register">Daftar sekarang</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/static/js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/';
    }

    const userSelectEl = document.getElementById('user-preset-select');
    const passSelectEl = document.getElementById('password-preset-select');
    const usernameInputEl = document.getElementById('username');
    const passwordInputEl = document.getElementById('password');
    let quickUsersMap = {};

    function applyUserSelection(selectedVal) {
      if (selectedVal === '__manual__') {
        usernameInputEl.value = '';
        usernameInputEl.focus();
        return;
      }
      if (!selectedVal || !quickUsersMap[selectedVal]) return;
      const meta = quickUsersMap[selectedVal];
      usernameInputEl.value = meta.username;
      const defPass = meta.default_password || (meta.username.toLowerCase() === 'semua' ? 'semua' : 'perampok');
      passSelectEl.value = defPass;
      passwordInputEl.value = defPass;
    }

    function applyPasswordSelection(selectedVal) {
      if (selectedVal === '__manual__') {
        passwordInputEl.value = '';
        passwordInputEl.focus();
        return;
      }
      passwordInputEl.value = selectedVal;
    }

    userSelectEl.addEventListener('change', (e) => applyUserSelection(e.target.value));
    passSelectEl.addEventListener('change', (e) => applyPasswordSelection(e.target.value));

    async function loadQuickUsers() {
      try {
        const res = await fetch('/api/auth/quick-users');
        const data = await res.json();
        const users = Array.isArray(data.users) ? data.users : [];
        quickUsersMap = {};
        userSelectEl.innerHTML = '';

        users.forEach((u) => {
          quickUsersMap[u.username] = u;
          const opt = document.createElement('option');
          opt.value = u.username;
          opt.style.background = '#0f172a';
          opt.style.color = '#f8fafc';
          if (u.username.toLowerCase() === 'semua') {
            opt.textContent = `🌐 ${u.username} (${u.account_count} akun — Semua Akun)`;
          } else {
            opt.textContent = `👤 ${u.username} (${u.account_count} akun)`;
          }
          userSelectEl.appendChild(opt);
        });

        const manualOpt = document.createElement('option');
        manualOpt.value = '__manual__';
        manualOpt.textContent = '✏️ Ketik username manual...';
        manualOpt.style.background = '#0f172a';
        manualOpt.style.color = '#f8fafc';
        userSelectEl.appendChild(manualOpt);

        if (users.length > 0) {
          userSelectEl.value = users[0].username;
          applyUserSelection(users[0].username);
        }
      } catch (err) {
        userSelectEl.innerHTML = '<option value="__manual__">✏️ Ketik username manual...</option>';
      }
    }

    loadQuickUsers();
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          localStorage.setItem('user', JSON.stringify(data.user));
          showToast('Login berhasil! Mengalihkan...', 'success');
          setTimeout(() => window.location.href = '/', 800);
        } else {
          showToast(data.detail || 'Login gagal', 'error');
        }
      } catch (err) {
        showToast('Koneksi server gagal', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk</span>';
      }
    });
  </script>
</body>
</html>
